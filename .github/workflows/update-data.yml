name: Perbarui data titik panas

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Isi riwayat 400 hari ke belakang (cukup sekali)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ambil dan olah data FIRMS
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: node scripts/fetch-firms.mjs

      - name: Isi riwayat ke belakang
        if: ${{ inputs.backfill }}
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: node scripts/backfill-history.mjs
        
      - name: Buat ringkasan harian (AI)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/ringkasan-ai.mjs

      - name: Simpan perubahan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data
          if git diff --cached --quiet; then
            echo "Tidak ada data baru."
            exit 0
          fi
          git commit -m "data: perbarui titik panas FIRMS"
          # Coba push sampai 3 kali, karena server GitHub kadang error sesaat
          # atau ada commit baru di main yang perlu digabung dulu.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push gagal (percobaan $i), coba lagi..."
            sleep $((i * 15))
            git pull --rebase origin main || true
          done
          exit 1